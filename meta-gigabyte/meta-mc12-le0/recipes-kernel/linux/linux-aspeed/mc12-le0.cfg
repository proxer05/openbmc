# include i2c super-i/o driver, but not host-side (lpc) driver
CONFIG_SENSORS_NCT6775_CORE=y
CONFIG_SENSORS_NCT6775_I2C=y
CONFIG_SENSORS_NCT6775=n

CONFIG_SENSORS_SBRMI=y
# https://cateee.net/lkddb/web-lkddb/SENSORS_SBTSI.html
CONFIG_SENSORS_SBTSI=y
CONFIG_SENSORS_LM75=y
CONFIG_SENSORS_NCT7802=y

CONFIG_I2C_MUX_PCA954x=y

# --- /dev/mem stays restricted -----------------------------------------------
# The AMI host-push window (the BIOS drops its SMBIOS tables into reserved DRAM
# at 0x9e000000 and then announces them over NetFn 0x2E) is read through its
# own device node, /dev/aspeed-lpc-ctrl, which the DTS points at that
# carve-out. The only remaining /dev/mem use is the SCU register poke at
# 0x1e6e2000 (endisShareMemory in ami-oem-probe), which is MMIO and so passes
# the strict check unaided.
#
# Clearing this was only ever a diagnostic for "did the BIOS write nowhere, or
# just somewhere /dev/mem refuses to look?" The push now lands and is consumed,
# so the question is answered and the kernel default returns.
CONFIG_STRICT_DEVMEM=y

CONFIG_REALTEK_PHY=y

# For reading DDR4 DIMM SPD/EEPROM data on i2c5
CONFIG_EEPROM_EE1004=y

# For reading DDR4 DIMM TSE2004 temp. sensors
CONFIG_SENSORS_JC42=y
